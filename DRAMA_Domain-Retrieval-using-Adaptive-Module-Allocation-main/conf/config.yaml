defaults:
  - _self_
  - model: all_minilm
  - dataset: political_science
  - logging: default
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled 

general:
  seed: 42
  num_classes: 4
  reduction_factor: 4
  label_file: ../dataset/all/label_to_id.json
  all_model_dir: ../models/all
  all_runs_dir: ../runs/all/
  general_model_dir: ../models
  gating_mode: top_k
  patience: 10

hydra:
  run:  
    dir: .
  job:
    chdir: True